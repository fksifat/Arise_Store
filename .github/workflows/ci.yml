name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arise
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: arise_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U arise -d arise_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: services/api
      DATABASE_URL: postgresql+psycopg://arise:ci-password@localhost:5432/arise_test
      TEST_DATABASE_URL: postgresql+psycopg://arise:ci-password@localhost:5432/arise_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r services/api/requirements-dev.txt
      - run: alembic -c services/api/alembic.ini upgrade head
      - run: alembic -c services/api/alembic.ini check
      - run: pytest services/api/tests -q
      - run: pip-audit -r services/api/requirements.txt
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      - run: npm audit
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: bash scripts/setup-local.sh --docker
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bash scripts/test-browser.sh
